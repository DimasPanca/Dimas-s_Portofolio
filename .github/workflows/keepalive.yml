name: keepalive
# Free Supabase projects pause after about 7 days without activity; one anonymous read every few days prevents that.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public row
        env:
          URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured yet; skipping"; exit 0; fi
          curl -fsS "$URL/rest/v1/site_settings?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo ok
