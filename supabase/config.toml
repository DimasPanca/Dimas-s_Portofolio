# Supabase project configuration (PRD §9.7). Apply with the Supabase CLI: `supabase link`, `supabase db push`,
# `supabase functions deploy` and `supabase config push`. The admin URL below must match the admin's Vercel domain.

[auth]
site_url = "https://dimas-panca-admin.vercel.app"
additional_redirect_urls = ["https://dimas-panca-admin.vercel.app", "http://localhost:5174"]
# Only the owner account exists; nobody can sign up.
enable_signup = false

[auth.email]
# Keep the email provider ON: it carries the one-time sign-in code. New sign-ups are blocked by
# auth.enable_signup above, so only the pre-created owner account can ever receive a code.
enabled = true
otp_length = 6
otp_expiry = 600

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# The contact form and the event counter are public; publishing checks the user's token itself.
[functions.contact]
verify_jwt = false

[functions.track]
verify_jwt = false

[functions.trigger-deploy]
verify_jwt = false
